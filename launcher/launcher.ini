# Read by Launcher.cs and build.bat (drez-containerize templates\launcher). Rebuild:
#   node <estate>\Skills\drez-containerize\scripts\make-launcher.js <this app folder>
# Opens the main page, the PHP web site, through tools\serve.ps1, which starts the
# drive's PostgreSQL and PHP, picks a free port, opens the browser and shows its own
# failures. Stop: tools\serve.ps1 stop. The Data Console (the backend) starts
# separately: tools\data-console.ps1 start -Open.
exe=PRI District Tracker.exe
icon=launcher\icon.ico
name=PRI District Tracker
require=tools\serve.ps1|serve.ps1 is missing from {app}\tools.\n\nThe app folder is incomplete. If it is on OneDrive, it may still be downloading.
require=tools\router.php|router.php is missing from {app}\tools.\n\nThe app folder is incomplete. If it is on OneDrive, it may still be downloading.
require=tools\php\php.exe|PHP is missing from {app}\tools\php.\n\nRun SETUP.bat in this folder first. It copies the portable PHP.
require=config.local.json|PRI District Tracker is not set up on this computer yet.\n\nRun SETUP.bat in this folder first. It checks for Python and PHP and creates config.local.json.
require=index.html|The main page has not been built:\n{path}\n\nRun py scripts\build_site.py in this folder first.
run=powershell -NoProfile -ExecutionPolicy Bypass -File "{app}\tools\serve.ps1" start -Open
